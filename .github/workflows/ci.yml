name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @evt/web build

  # Deploys the Worker with the web client as static assets. Runs on pushes to
  # main once the repository has the CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID secrets; without them the job is skipped.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip without Cloudflare secrets
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy"
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: pnpm/action-setup@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm --filter @evt/web build
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm --filter @evt/server run deploy
